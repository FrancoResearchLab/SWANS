executor: slurm
jobs: 100
latency-wait: 60
rerun-incomplete: true
printshellcmds: true

resources:
  cellranger_jobs: 10

default-resources:
  slurm_account: "hpcusers"
  slurm_partition: "defq"
  mem_mb: 8000
  runtime: 24:00:00
  time: 24:00:00
  ntasks: 1
  cpus_per_task: 4

set-threads:
  cellranger_counts: 16

set-resources:
  cellranger_counts:
    mem_mb: 64000
    runtime: 24:00:00
    time: 24:00:00
    cpus_per_task: 16
    cellranger_jobs: 1
    